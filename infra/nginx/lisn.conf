# 1단계 — HTTPS 인증서를 받기 전 부팅용 설정입니다. HTTP(80)만 엽니다.
#
# 처음 `docker compose up` 할 때는 이 파일이 쓰입니다. 인증서를 받은 뒤에는
# infra/nginx/lisn-ssl.conf.sample 을 이 이름(lisn.conf)으로 복사해
# 덮어쓰세요 — 순서는 infra/README.md 「HTTPS 발급」절을 보세요.
#
# certbot 이 도메인 소유를 증명하는 방법(HTTP-01 challenge)이 이 경로를
# 통해 파일을 주고받는 것이라, 이 location 은 2단계 이후에도 계속 필요합니다
# (인증서 갱신 때마다 다시 씁니다).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # api_router 의 접두사가 /api/v1 입니다(backend/app/api/v1/__init__.py).
    # /api/ 로 잘못 잡으면 전부 404 가 납니다.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 가 만드는 /docs (Swagger) 도 같이 넘깁니다 — main.py 주석이
    # "구현이 진행되면 이 /docs 가 API 명세의 정본"이라고 명시합니다.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # 관리자 웹(React) 정적 빌드. SPA 라우팅이라 없는 경로는 index.html 로
    # 떨어뜨립니다.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
