<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #fff; position: relative; }
  .hero { width: 390px; display: block; }
  .body { padding: 26px 30px 0; }
  .body h1 { font-size: 25px; letter-spacing: -.8px; }
  .body p { color: #9AA1B8; font-size: 12px; margin-top: 8px; }
  .form { margin-top: 26px; }
  .input-group + .input-group { margin-top: 15px; }
  .field { height: 52px; border-radius: 15px; font-size: 13px; }
  .primary { margin-top: 26px; }
  .find { margin-top: 15px; text-align: center; }
  .find span { color: #8C94AE; font-size: 12px; font-weight: 600; }
  .find span b { color: var(--primary); font-weight: 750; }
  .join { margin-top: 15px; height: 50px; background: #F4F6FC; border: 0; color: #6B7492; }
</style>
<body class="mobile">
  <img class="hero" src="../assets/header-login.png" alt="">
  <div class="body">
    <h1>다시 만나 반가워요</h1>
    <p>마음이와 함께 오늘 하루를 돌아봐요.</p>
    <div class="form">
      <div class="input-group">
        <span class="label">이메일</span>
        <div class="field">maeum@example.com</div>
      </div>
      <div class="input-group">
        <span class="label">비밀번호</span>
        <div class="field">••••••••••</div>
      </div>
      <div class="primary">로그인</div>
      <div class="find"><span>비밀번호를 잊으셨나요? <b>비밀번호 찾기</b></span></div>
      <div class="ghost join">처음 오셨나요? 회원가입</div>
    </div>
  </div>
</body>
