<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #fff; }
  .mobile-head { height: 50px; padding: 16px 20px 0; }
  .step { color: var(--primary); font-size: 11.5px; font-weight: 800; letter-spacing: .4px; padding: 0 22px; }
  .mobile-title { padding: 5px 22px 10px; }
  .mobile-title h1 { font-size: 22px; }
  .content { padding: 4px 20px 0; }
  .input-group { margin-bottom: 11px; }
  .field { height: 44px; }
  .label { margin-bottom: 6px; }
  .with-btn { display: flex; gap: 8px; }
  .with-btn .field { flex: 1; }
  .dup { width: 84px; height: 44px; border-radius: 14px; background: var(--primary); color: #fff;
         display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 750; flex: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gender { display: flex; gap: 16px; align-items: center; height: 44px; }
  .gender label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #4E5878; font-weight: 600; }
  .box { width: 21px; height: 21px; border-radius: 7px; background: var(--primary);
         display: flex; align-items: center; justify-content: center; flex: none; }
  .box.empty { background: #E4E9F7; }
  .unit { position: relative; }
  .unit .field { padding-right: 42px; }
  .unit i { position: absolute; right: 14px; top: 0; height: 44px; display: flex; align-items: center;
            font-style: normal; color: #A8AFC4; font-size: 12px; font-weight: 600; }
  .opt { color: var(--muted); font-weight: 600; }
  .primary { margin-top: 16px; }
</style>
<body class="mobile">
  <div class="mobile-head">
    <div class="back"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#5A668B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="step">STEP 02</div>
  <div class="mobile-title"><h1>기본 정보를 알려주세요</h1><p>꼭 필요한 정보만 간단히 여쭤볼게요.</p></div>
  <div class="content">
    <div class="input-group">
      <span class="label">이메일</span>
      <div class="with-btn"><div class="field">maeum@example.com</div><div class="dup">중복확인</div></div>
    </div>
    <div class="input-group">
      <span class="label">비밀번호</span>
      <div class="field">••••••••••</div>
    </div>
    <div class="input-group">
      <span class="label">비밀번호 확인</span>
      <div class="field">••••••••••</div>
    </div>
    <div class="input-group">
      <span class="label">이름</span>
      <div class="field">김마음</div>
    </div>
    <div class="two">
      <div class="input-group">
        <span class="label">생년월일</span>
        <div class="field">1994.05.16</div>
      </div>
      <div class="input-group">
        <span class="label">키 <span class="opt">· 선택</span></span>
        <div class="unit"><div class="field">168</div><i>cm</i></div>
      </div>
    </div>
    <div class="input-group">
      <span class="label">성별</span>
      <div class="gender">
        <label><span class="box"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3"/></svg></span>남자</label>
        <label><span class="box empty"></span>여자</label>
        <label><span class="box empty"></span>기타</label>
      </div>
    </div>
    <div class="input-group">
      <span class="label">연락처 <span class="opt">· 선택</span></span>
      <div class="field placeholder">010-0000-0000</div>
    </div>
    <div class="primary">회원가입 완료</div>
  </div>
</body>
